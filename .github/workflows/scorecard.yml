name: Scorecard

# OpenSSF Scorecard: supply-chain checks (branch protection, pinned dependencies, token
# permissions, ...). Results appear in the Security tab and on the public Scorecard API.

on:
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 2'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
