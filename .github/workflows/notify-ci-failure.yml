name: Notify CI Failures

# Posts failures of CI and Security Audit on master to Discord. The shared workflow ignores
# workflows whose name contains "Release" (the release pipeline has its own notifier) and runs
# only for the default branch, so pull request failures stay quiet.

# workflow_run runs with secrets: only runs of this repository's own pushes and schedules are
# reported (never pull requests, whose branch names and commits are not trusted), and no code is
# checked out here.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI", "Security Audit"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event != 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: poli0981/.github/.github/workflows/notify-ci-failure.yml@main
    secrets:
      DISCORD_CI_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
