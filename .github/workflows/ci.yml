name: CI

# Required checks for master: build-test, dead-code, licenses, vuln-audit.
# No path filters: a required check that does not run would block every pull request.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: build-test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore AutoClick.slnx

      - name: Check formatting
        run: |
          dotnet format whitespace AutoClick.slnx --verify-no-changes --no-restore
          dotnet format style AutoClick.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build AutoClick.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >-
          dotnet test --solution AutoClick.slnx -c Release --no-build
          --results-directory artifacts/test-results --minimum-expected-tests 10
          --coverage --coverage-output-format cobertura

      - name: Coverage
        shell: pwsh
        run: |
          dotnet reportgenerator "-reports:artifacts/test-results/**/*.cobertura.xml" -targetdir:artifacts/coverage `
            "-reporttypes:Cobertura;MarkdownSummaryGithub" "-assemblyfilters:+AutoClick.*;-AutoClick.*.Tests;-AutoClick.ClickTarget"
          Get-Content artifacts/coverage/SummaryGithub.md | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          ./eng/Test-Coverage.ps1 -Cobertura artifacts/coverage/Cobertura.xml

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 7

      - name: Build info
        id: info
        shell: pwsh
        run: ./eng/Get-BuildInfo.ps1

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/AutoClick.UI/AutoClick.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:ContinuousIntegrationBuild=true -o artifacts/publish

      - name: Third-party notices
        shell: pwsh
        run: ./eng/New-ThirdPartyNotices.ps1 -OutFile artifacts/publish/THIRD-PARTY-NOTICES.txt

      - name: Smoke test
        shell: pwsh
        run: ./eng/Invoke-SmokeTest.ps1 -Exe artifacts/publish/AutoClick.UI.exe

      - name: Velopack pack (dry run with the real release notes)
        shell: pwsh
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          ./eng/Get-ReleaseNotes.ps1 -Version $env:VERSION -OutFile artifacts/release_notes.md
          dotnet vpk pack --packId AutoClick --packVersion $env:VERSION --packDir artifacts/publish `
            --mainExe AutoClick.UI.exe --packTitle AutoClick --packAuthors poli0981 `
            --icon src/AutoClick.UI/Assets/app.ico --channel win --delta None `
            --releaseNotes artifacts/release_notes.md --outputDir artifacts/releases
          Get-ChildItem artifacts/releases | Format-Table Name, Length

  dead-code:
    name: dead-code
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build
        run: |
          dotnet tool restore
          dotnet build AutoClick.slnx -c Release -p:ContinuousIntegrationBuild=true

      - name: InspectCode (solution-wide analysis)
        run: >-
          dotnet jb inspectcode AutoClick.slnx --no-build --properties:Configuration=Release --swea
          --format=Sarif --output=artifacts/inspectcode.sarif --no-updates --verbosity=WARN

      - name: Unused-code gate
        shell: pwsh
        run: ./eng/Test-InspectCode.ps1 -Sarif artifacts/inspectcode.sarif

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inspectcode
          path: artifacts/inspectcode.sarif
          if-no-files-found: ignore
          retention-days: 14

  licenses:
    name: licenses
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: |
          dotnet tool restore
          dotnet restore src/AutoClick.UI/AutoClick.UI.csproj

      - name: License policy and notices
        shell: pwsh
        run: ./eng/New-ThirdPartyNotices.ps1 -OutFile artifacts/THIRD-PARTY-NOTICES.txt

      - name: Upload notices
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: artifacts/THIRD-PARTY-NOTICES.txt
          retention-days: 14

  vuln-audit:
    name: vuln-audit
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AutoClick.slnx

      - name: Known vulnerabilities (direct and transitive)
        shell: pwsh
        run: ./eng/Test-VulnerablePackages.ps1
