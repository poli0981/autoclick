name: Notify Release Pipeline

# Reports every finished Release run (success, failure or cancelled) for tag pushes and manual
# rebuilds to Discord.

# workflow_run runs with secrets: only Release runs of this repository are reported (tag pushes
# and manual rebuilds by maintainers), and no code is checked out here.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  notify:
    if: >-
      contains(fromJSON('["success", "failure", "cancelled"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["push", "workflow_dispatch"]'), github.event.workflow_run.event) &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: poli0981/.github/.github/workflows/notify-release-pipeline.yml@main
    secrets:
      DISCORD_RELEASE_PIPELINE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_PIPELINE_WEBHOOK }}
