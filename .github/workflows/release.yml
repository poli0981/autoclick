name: Release

# Builds the tagged commit and uploads a DRAFT GitHub release. Verify the draft (see
# docs/RELEASING.md), then publish it from your own account: publishing with a user token
# raises `release: published`, which runs the announcement and discussion workflows.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild and upload as a draft (e.g. v1.3.4)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: build
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve and validate tag
        id: tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Tag '$tag' is not of the form vX.Y.Z." }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "version=$($tag.Substring(1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'

      - name: Restore tools
        run: dotnet tool restore

      - name: Check version and vpk
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: ./eng/Get-BuildInfo.ps1 -ExpectedVersion $env:VERSION

      - name: Release notes from CHANGELOG
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          ./eng/Get-ReleaseNotes.ps1 -Version $env:VERSION -OutFile artifacts/release_notes.md

      - name: Publish (win-x64, self-contained)
        run: dotnet publish src/AutoClick.UI/AutoClick.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:ContinuousIntegrationBuild=true -o artifacts/publish

      - name: Smoke test
        shell: pwsh
        run: ./eng/Invoke-SmokeTest.ps1 -Exe artifacts/publish/AutoClick.UI.exe

      - name: Velopack pack
        shell: pwsh
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        # Full package only: this release changes the .NET runtime, so a delta would be
        # nearly as large as the full package.
        run: |
          dotnet vpk pack --packId AutoClick --packVersion $env:VERSION --packDir artifacts/publish `
            --mainExe AutoClick.UI.exe --packTitle AutoClick --packAuthors poli0981 `
            --icon src/AutoClick.UI/Assets/app.ico --channel win --delta None `
            --releaseNotes artifacts/release_notes.md --outputDir artifacts/releases
          Get-ChildItem artifacts/releases | Format-Table Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: velopack-release
          path: artifacts/releases/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: upload draft release
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.build.outputs.tag }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.4xx'

      - name: Restore tools
        run: dotnet tool restore

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: velopack-release
          path: artifacts/releases

      - name: Upload draft to GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $commit = git rev-parse HEAD
          dotnet vpk upload github --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" --token $env:GH_TOKEN `
            --tag $env:TAG --targetCommitish $commit --releaseName "AutoClick v$env:VERSION" `
            --merge --channel win --outputDir artifacts/releases
